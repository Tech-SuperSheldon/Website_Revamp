         (.box-description). On portrait the caption is repurposed: the
         bundle's own content (.box-description-content — the name/location bar
         plus the tagline that types out) is hidden and the "How We Get You

         it inherits the caption's bottom-pinned position and GSAP's
         scroll-scrubbed fade of the .about-description wrapper.
         On phones the box is also narrowed and centred — the parent page pins
         the enquiry arrow, the WhatsApp button and the Nova chat bubble to the
         bottom-right corner (~60px in from the right edge; see
         src/components/ArrowAndWhatsapp.jsx). Insetting the box equally on
         both sides keeps the card clear of that rail while still reading as
         centred — padding only the right side left a ragged gap, and insetting
         only the right side looked pinned.
         Selectors are repeated (.box-description.box-description…) purely to
         out-specify the bundle's scoped `[data-v-*]` rules without !important;
         the hash is regenerated on every rebuild of the Vue app, so we must
         not name it here. Keep in sync with the other */home2-hero/index.html
         copy. -->

      @media (min-width: 1024px) {

          width: 32rem;

        #ss-phone-form .ss-submit-inline {

        #ss-trust {

        #ss-trust .ss-trust-col { align-items: flex-start; }
        #ss-trust .ss-trust-col + .ss-trust-col {
          padding-left: 28px;
          border-left: 1px solid rgba(45, 42, 36, 0.15);
        }

    </style>
    <script>
      (function () {
        var FORM_ID = "ss-phone-form";
        var TRUST_ID = "ss-trust";

        // Curated country list for the dial-code picker — kept in step with
        // src/components/demo/countries.js, which the booking wizard uses, so
        // a code chosen here always resolves to the same country there.
        var COUNTRIES = [
          { iso: "AU", name: "Australia", dial: "61", flag: "\uD83C\uDDE6\uD83C\uDDFA" },
          { iso: "IN", name: "India", dial: "91", flag: "\uD83C\uDDEE\uD83C\uDDF3" },
          { iso: "US", name: "United States", dial: "1", flag: "\uD83C\uDDFA\uD83C\uDDF8" },
          { iso: "GB", name: "United Kingdom", dial: "44", flag: "\uD83C\uDDEC\uD83C\uDDE7" },
          { iso: "NZ", name: "New Zealand", dial: "64", flag: "\uD83C\uDDF3\uD83C\uDDFF" },
          { iso: "CA", name: "Canada", dial: "1", flag: "\uD83C\uDDE8\uD83C\uDDE6" },
          { iso: "AE", name: "United Arab Emirates", dial: "971", flag: "\uD83C\uDDE6\uD83C\uDDEA" },
          { iso: "SG", name: "Singapore", dial: "65", flag: "\uD83C\uDDF8\uD83C\uDDEC" },
          { iso: "SA", name: "Saudi Arabia", dial: "966", flag: "\uD83C\uDDF8\uD83C\uDDE6" },
          { iso: "QA", name: "Qatar", dial: "974", flag: "\uD83C\uDDF6\uD83C\uDDE6" },
          { iso: "KW", name: "Kuwait", dial: "965", flag: "\uD83C\uDDF0\uD83C\uDDFC" },
          { iso: "OM", name: "Oman", dial: "968", flag: "\uD83C\uDDF4\uD83C\uDDF2" },
          { iso: "BH", name: "Bahrain", dial: "973", flag: "\uD83C\uDDE7\uD83C\uDDED" },
          { iso: "MY", name: "Malaysia", dial: "60", flag: "\uD83C\uDDF2\uD83C\uDDFE" },
          { iso: "ID", name: "Indonesia", dial: "62", flag: "\uD83C\uDDEE\uD83C\uDDE9" },
          { iso: "PH", name: "Philippines", dial: "63", flag: "\uD83C\uDDF5\uD83C\uDDED" },
          { iso: "PK", name: "Pakistan", dial: "92", flag: "\uD83C\uDDF5\uD83C\uDDF0" },
          { iso: "BD", name: "Bangladesh", dial: "880", flag: "\uD83C\uDDE7\uD83C\uDDE9" },
          { iso: "LK", name: "Sri Lanka", dial: "94", flag: "\uD83C\uDDF1\uD83C\uDDF0" },
          { iso: "NP", name: "Nepal", dial: "977", flag: "\uD83C\uDDF3\uD83C\uDDF5" },
          { iso: "ZA", name: "South Africa", dial: "27", flag: "\uD83C\uDDFF\uD83C\uDDE6" },
          { iso: "NG", name: "Nigeria", dial: "234", flag: "\uD83C\uDDF3\uD83C\uDDEC" },
          { iso: "KE", name: "Kenya", dial: "254", flag: "\uD83C\uDDF0\uD83C\uDDEA" },
          { iso: "IE", name: "Ireland", dial: "353", flag: "\uD83C\uDDEE\uD83C\uDDEA" },
          { iso: "DE", name: "Germany", dial: "49", flag: "\uD83C\uDDE9\uD83C\uDDEA" },
          { iso: "FR", name: "France", dial: "33", flag: "\uD83C\uDDEB\uD83C\uDDF7" },
          { iso: "NL", name: "Netherlands", dial: "31", flag: "\uD83C\uDDF3\uD83C\uDDF1" },
          { iso: "ES", name: "Spain", dial: "34", flag: "\uD83C\uDDEA\uD83C\uDDF8" },
          { iso: "IT", name: "Italy", dial: "39", flag: "\uD83C\uDDEE\uD83C\uDDF9" },
          { iso: "SE", name: "Sweden", dial: "46", flag: "\uD83C\uDDF8\uD83C\uDDEA" },
          { iso: "CH", name: "Switzerland", dial: "41", flag: "\uD83C\uDDE8\uD83C\uDDED" },
          { iso: "HK", name: "Hong Kong", dial: "852", flag: "\uD83C\uDDED\uD83C\uDDF0" },
          { iso: "JP", name: "Japan", dial: "81", flag: "\uD83C\uDDEF\uD83C\uDDF5" },
          { iso: "CN", name: "China", dial: "86", flag: "\uD83C\uDDE8\uD83C\uDDF3" }
        ];
        var FALLBACK_ISO = "GB";

        function findByIso(iso) {
          if (!iso) return null;
          var target = String(iso).toUpperCase();
          for (var i = 0; i < COUNTRIES.length; i++) {
            if (COUNTRIES[i].iso === target) return COUNTRIES[i];
          }
          return null;
        }

        function buildForm() {
          var form = document.createElement("form");
          form.id = FORM_ID;
          form.setAttribute("novalidate", "");
          form.innerHTML =
            '<div class="ss-pill-wrap">' +
            '<div class="ss-pill">' +
            '<button class="ss-dial" type="button" aria-haspopup="listbox" ' +
            'aria-expanded="false" aria-label="Select country code">' +
            '<span class="ss-dial-flag"></span>' +
            '<span class="ss-dial-code"></span>' +
            '<svg class="ss-dial-caret" viewBox="0 0 20 20" fill="currentColor" ' +
            'aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 ' +
            '011.06.02L10 11.06l3.71-3.83a.75.75 0 111.08 1.04l-4.25 4.39a.75.75 0 ' +
            '01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>' +
            "</button>" +
            '<input class="ss-input" type="tel" inputmode="numeric" ' +
            'placeholder="Phone number" aria-label="Phone number" />' +
            '<button class="ss-submit ss-submit-inline" type="submit">Try a Free Class' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ' +
            'aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>' +
            "</svg></button>" +
            "</div>" +
            '<div class="ss-country-menu" role="listbox" hidden>' +
            '<div class="ss-country-search-wrap">' +
            '<input class="ss-country-search" type="text" autocomplete="off" ' +
            'placeholder="Search country or code" aria-label="Search country" />' +
            "</div>" +
            '<ul class="ss-country-list"></ul>' +
            "</div>" +
            "</div>" +
            '<button class="ss-submit ss-submit-block" type="submit">Try a Free Class</button>' +
            '<p class="ss-error" role="alert"></p>';

          var input = form.querySelector(".ss-input");
          var error = form.querySelector(".ss-error");
          var dialButton = form.querySelector(".ss-dial");
          var dialFlag = form.querySelector(".ss-dial-flag");
          var dialCode = form.querySelector(".ss-dial-code");
          var menu = form.querySelector(".ss-country-menu");
          var search = form.querySelector(".ss-country-search");
          var list = form.querySelector(".ss-country-list");

          var country = findByIso(FALLBACK_ISO) || COUNTRIES[0];
          // Once the visitor picks a country themselves, the geo lookup below
          // must not overwrite it.
          var countryPicked = false;

          function paintDial() {
            dialFlag.textContent = country.flag;
            dialCode.textContent = "+" + country.dial;
          }

          function renderList() {
            var query = (search.value || "").trim().toLowerCase();
            var digits = query.replace(/\D/g, "");
            var matches = COUNTRIES.filter(function (c) {
              if (!query) return true;
              return (
                c.name.toLowerCase().indexOf(query) !== -1 ||
                c.iso.toLowerCase().indexOf(query) !== -1 ||
                (digits && c.dial.indexOf(digits) === 0)
              );
            });

            list.innerHTML = "";
            if (!matches.length) {
              var empty = document.createElement("li");
              empty.className = "ss-country-empty";
              empty.textContent = "No matches";
              list.appendChild(empty);
              return;
            }

            matches.forEach(function (c) {
              var li = document.createElement("li");
              var button = document.createElement("button");
              button.type = "button";
              button.className = "ss-country-item";
              button.setAttribute("role", "option");
              button.setAttribute("aria-selected", c.iso === country.iso ? "true" : "false");
              button.innerHTML =
                '<span class="ss-dial-flag"></span>' +
                '<span class="ss-country-name"></span>' +
                '<span class="ss-country-dial"></span>';
              button.querySelector(".ss-dial-flag").textContent = c.flag;
              button.querySelector(".ss-country-name").textContent = c.name;
              button.querySelector(".ss-country-dial").textContent = "+" + c.dial;
              button.addEventListener("click", function () {
                country = c;
                countryPicked = true;
                paintDial();
                closeMenu();
                input.focus();
              });
              li.appendChild(button);
              list.appendChild(li);
            });
          }

          function openMenu() {
            menu.hidden = false;
            dialButton.setAttribute("aria-expanded", "true");
            search.value = "";
            renderList();
            search.focus();
          }

          function closeMenu() {
            menu.hidden = true;
            dialButton.setAttribute("aria-expanded", "false");

            var start = tx + gap;
            var len = Math.max(0, end - start - 5);
            o.line.style.left = start + "px";
            o.line.style.top = y - 2 + "px";
            o.line.style.width = len + "px";
            o.line.style.transform = "rotate(0deg)";
            o.dotA.style.left = tx + "px";
            o.dotA.style.top = y + "px";
            o.dotB.style.left = end + "px";
            o.dotB.style.top = y + "px";
          });
          reveal();
        }

        function layout() {
          if (!root || !root.isConnected) return;
          var W = root.clientWidth;
          var H = root.clientHeight;
          if (!W || !H) return;
          var rootRect = root.getBoundingClientRect();
          var m = mode();
          root.classList.remove("ss-mode-p", "ss-mode-l", "ss-mode-s");
          root.classList.add("ss-mode-" + m);
          root.classList.toggle("ss-row", m === "s");
          if (m === "p") return layoutPortrait(W, H);
          sets.l.forEach(function (o) {
            var p = o.item[m];
            var x = (p.x / 100) * W;
            var y = (p.y / 100) * H;
            var tx = (p.tx / 100) * W;
            var ty = (p.ty / 100) * H;
            // Place the callout so its icon centre sits at (x,y). In row mode
            // the callout is not centred by transform, so offset by the icon.
            var icon = o.el.firstElementChild;
            var iconH = icon.offsetHeight || 0;
            var iconW = icon.offsetWidth || 0;
            o.el.style.left = (m === "s" ? x - iconW / 2 : x) + "px";
            o.el.style.top = y - iconH / 2 + "px";
            // Leader from the icon circle's edge (or the whole callout box for
            // a = "box"), plus a small gap, to the target.
            var start;
            if (o.item.a === "box") {
              var r = o.el.getBoundingClientRect();
              start = edgePoint(
                { left: r.left - rootRect.left, top: r.top - rootRect.top, width: r.width, height: r.height },
                tx,
                ty
              );
            } else {
              var ddx = tx - x;
              var ddy = ty - y;
              var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
              // +7 clears the outer reticle ring drawn by .ss-icon::before
              var rad = iconW / 2 + 7;
              start = { x: x + (ddx / dd) * rad, y: y + (ddy / dd) * rad };
            }
            var dx = tx - start.x;
            var dy = ty - start.y;
            var len = Math.sqrt(dx * dx + dy * dy) || 1;
            var gap = 6;
            var ux = dx / len;
            var uy = dy / len;
            var sx = start.x + ux * gap;
            var sy = start.y + uy * gap;
            var l = Math.max(0, len - gap - 5);
            o.line.style.left = sx + "px";
            o.line.style.top = sy - 2 + "px";
            o.line.style.width = l + "px";
            o.line.style.transform = "rotate(" + (Math.atan2(dy, dx) * 180) / Math.PI + "deg)";
            o.dotA.style.left = sx + "px";
            o.dotA.style.top = sy + "px";
            o.dotB.style.left = tx + "px";
            o.dotB.style.top = ty + "px";
          });
        }

        // Progress (0..1) of the bundle's portrait sections timeline, whose
        // ScrollTrigger is start "top 25%" / end "bottom bottom" on the about
        // spacer (#about, 250lvh). Derived from the spacer's own rect so it
        // stays exact whatever the viewport height.
        function progress() {
          var spacer = document.getElementById("about") || document.querySelector(".about-spacer");
          if (!spacer) return -1;
          var H = window.innerHeight;
          var r = spacer.getBoundingClientRect();
          var range = r.height - 0.75 * H;
          if (range <= 0) return -1;
          return (0.25 * H - r.top) / range;
        }

        function reveal() {
          if (!root || !root.isConnected || mode() !== "p") return;
          var p = progress();
          sets.p.forEach(function (o, i) {
            var on = p >= P_REVEAL[i];
            o.el.classList.toggle("ss-on", on);
            o.line.classList.toggle("ss-on", on);
            o.dotA.classList.toggle("ss-on", on);
            o.dotB.classList.toggle("ss-on", on);
          });
        }

        function watchOpacity(wrapper) {
          var apply = function () {
            var o = parseFloat(wrapper.style.opacity);
            if (isNaN(o)) o = 1;
            root.classList.toggle("ss-in", o > 0.02);
          };
          apply();
          new MutationObserver(apply).observe(wrapper, { attributes: true, attributeFilter: ["style"] });
        }

        function mount() {
          if (root && root.isConnected) return true;
          var wrapper = document.querySelector(".about-services");
          if (!wrapper) return false;
          wrapper.appendChild(root || build());
          watchOpacity(wrapper);
          layout();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
          return true;
        }

        function start() {
          if (!mount()) {
            var mo = new MutationObserver(function () {
              if (mount()) mo.disconnect();
            });
            mo.observe(document.body, { childList: true, subtree: true });
          }
          var raf = 0;
          var onResize = function () {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(layout);
          };
          window.addEventListener("resize", onResize);
          window.addEventListener("orientationchange", onResize);
          window.addEventListener("scroll", reveal, { passive: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>

    <!-- SuperSheldon "How We Get You There" card (portrait only). Replaces the
         bundle's scan caption content on phones/tablets held upright: mounted
         INSIDE .box-description (whose own .box-description-content is hidden
         by the portrait override in <head>), so it sits where the caption did —
         pinned above the progress bar — and fades in with the
         .about-description wrapper at .76 of the sections timeline, i.e. after
         the four body-part callouts have gone. Layout mirrors the supplied
         mock: centred title, three columns with a line icon, bold name and
         soft-blue subline, hairline dividers between columns. Landscape keeps
         the bundle's caption and never shows this card.
         Keep in sync with the other */home2-hero/index.html copy. -->
    <style>
      #ss-how { display: none; }
      @media (orientation: portrait) {
        #ss-how {
          display: block;
          max-width: 520px;
          margin: 0 auto;
          padding: 14px 10px 13px;
          border: 1px solid rgba(96, 148, 230, 0.6);
          border-radius: 18px;
          background: linear-gradient(180deg, rgba(14, 38, 92, 0.94) 0%, rgba(9, 24, 62, 0.96) 100%);
          box-shadow:
            0 14px 34px -14px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(150, 190, 255, 0.14);
          font-family: Urbanist, sans-serif;
          letter-spacing: 0;
          color: #fff;
          text-align: center;
        }
        #ss-how .ss-how-title {
          margin: 0 0 11px;
          font-size: 17px;
          font-weight: 800;
          line-height: 1.2;
          color: #fff;
        }
        #ss-how .ss-how-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
        }
        #ss-how .ss-how-col {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          padding: 0 5px;
          min-width: 0;
        }
        #ss-how .ss-how-col + .ss-how-col {
          border-left: 1px solid rgba(96, 148, 230, 0.45);
        }
        #ss-how .ss-how-icon {
          width: 24px;
          height: 24px;
          margin-bottom: 3px;
        }
        #ss-how .ss-how-icon svg {
          width: 100%;
          height: 100%;
          fill: none;
          stroke: #8fc1ff;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #ss-how .ss-how-name {
          margin: 0;
          font-size: 13px;
          font-weight: 800;
          line-height: 1.2;
          color: #fff;
        }
        #ss-how .ss-how-sub {
          margin: 0;
          font-size: 11.5px;
          font-weight: 500;
          line-height: 1.3;
          color: #aacbff;
        }
      }
      /* Roomier type once the box is wider than a phone (tablets upright). */
      @media (orientation: portrait) and (min-width: 480px) {
        #ss-how { padding: 18px 14px 16px; }
        #ss-how .ss-how-title { margin-bottom: 14px; font-size: 21px; }
        #ss-how .ss-how-col { gap: 4px; padding: 0 10px; }
        #ss-how .ss-how-icon { width: 30px; height: 30px; }
        #ss-how .ss-how-name { font-size: 16px; }
        #ss-how .ss-how-sub { font-size: 14px; }
      }
    </style>
    <script>
      (function () {
        var ID = "ss-how";
        var COLUMNS = [
          {
            name: "1:1 Expert Tutors",
            sub: "Diagnostics + PTMs",
            // Mortarboard: board + tassel + the cap body under it.
            icon:
              '<path d="M12 4.3 2.7 8.2 12 12.1l9.3-3.9L12 4.3Z"/>' +
              '<path d="M6.9 10v4.2c0 1.5 2.3 2.6 5.1 2.6s5.1-1.1 5.1-2.6V10"/>' +
              '<path d="M20.3 9v4"/>',
          },
          {
            name: "Infinite Question Bank",
            sub: "Personalized practice",
            // Lemniscate drawn as two loops meeting at the centre.
            icon:
              '<path d="M12 12C10.7 10.1 9.5 8.8 7.7 8.8a3.2 3.2 0 1 0 0 6.4c1.8 0 3-1.3 4.3-3.2Z"/>' +
              '<path d="M12 12c1.3 1.9 2.5 3.2 4.3 3.2a3.2 3.2 0 1 0 0-6.4c-1.8 0-3 1.3-4.3 3.2Z"/>',
          },
          {
            name: "AI Tutor",
            sub: "Available 24/7",
            // Robot head: antenna, rounded face, two dot eyes, mouth.
            icon:
              '<path d="M12 4.6v2.9"/>' +
              '<circle cx="12" cy="3.4" r="1.1"/>' +
              '<rect x="4.2" y="7.5" width="15.6" height="11.4" rx="3.6"/>' +
              '<circle cx="9.2" cy="12.4" r="1.2" style="fill:#8fc1ff;stroke:none"/>' +
              '<circle cx="14.8" cy="12.4" r="1.2" style="fill:#8fc1ff;stroke:none"/>' +
              '<path d="M9.6 16h4.8"/>',
          },
        ];

        function build() {
          var card = document.createElement("div");
          card.id = ID;
          card.innerHTML =
            '<p class="ss-how-title">How We Get You There</p>' +
            '<div class="ss-how-grid">' +
            COLUMNS.map(function (c) {
              return (
                '<div class="ss-how-col">' +
                '<div class="ss-how-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' +
                c.icon +
                "</svg></div>" +
                '<p class="ss-how-name">' + c.name + "</p>" +
                '<p class="ss-how-sub">' + c.sub + "</p>" +
                "</div>"
              );
            }).join("") +
            "</div>";
          return card;
        }

        function mount() {
          var box = document.querySelector(".box-description");
          if (!box) return false;
          if (!box.querySelector("#" + ID)) box.appendChild(build());
          return true;
        }

        function start() {
          mount();
          // The Vue app mounts async (and BoxDescription could be re-rendered),
          // so keep watching and re-mount whenever the box is missing the card.
          new MutationObserver(mount).observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>

        <use href="#logo-path" class="preloader-path" mask="url(#preloader-mask)"></use>

    </div>
  </body>
