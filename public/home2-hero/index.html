    <!-- SuperSheldon phone-portrait overrides for the two hologram overlays:
         .box-description (the "SuperSheldon · Australia" bar plus the copy
         that types out during the scan) and .box-services (the "Features"
         list). Both are absolutely positioned against the iframe's bottom
         edge, so on a phone they are the first things to go when vertical
         space is tight. Three adjustments:
           1. Narrower, centred boxes — the parent page pins the enquiry arrow,
              the WhatsApp button and the Nova chat bubble to the bottom-right
              corner (~60px in from the right edge; see
              src/components/ArrowAndWhatsapp.jsx). Insetting the box equally
              on both sides keeps the copy clear of that rail while still
              filling its box edge-to-edge — padding only the right side left
              a ragged gap, and insetting only the right side looked pinned.
           2. Compact caption — the bundle's portrait sizes (12/18px padding,
              22px name) are tuned for a full-screen viewport and waste ~30px
              of height inside an embedded hero.
           (A third block once compacted the .box-services Features card; that
              card is now replaced by the icon callouts further down.)
         Selectors are repeated (.box-description.box-description…) purely to
         out-specify the bundle's scoped `[data-v-*]` rules without !important;
         the hash is regenerated on every rebuild of the Vue app, so we must
         not name it here. Keep in sync with public/uk-home2-hero/index.html. -->
    <style>
      @media (orientation: portrait) and (max-width: 767.98px) {
        /* 1. The bundle pins both boxes flush left and spans them full width.
              Inset them equally instead, so they read as centred cards. The
              40px on top of the usual 16px outer margin is what keeps the
              copy clear of the parent page's floating rail (arrow + WhatsApp
              + Nova: 48px icons sitting 12px in from the right edge, see
              src/components/ArrowAndWhatsapp.jsx) — text now ends ~68px from
              the right edge, the rail starts at 60px. */
        .box-description.box-description.box-description {
          --ss-box-inset: calc(var(--space-outer) + 40px);
          left: var(--ss-box-inset);
          width: calc(100% - var(--ss-box-inset) * 2);
        }

        /* 2. Scan caption. */
        .box-description.box-description .box-description-details {
          padding: 8px 12px;
        }
        .box-description.box-description .box-description-details-name {
          font-size: 18px;
        }
        .box-description.box-description .box-description-details-location-copy {
          font-size: 14px;
        }
        .box-description.box-description .box-description-copy {
          padding: 8px 12px;
          font-size: 14px;
          line-height: 1.35;
        }

      }
    </style>

    <!-- SuperSheldon phone CTA injected into the hero (desktop only). Mirrors the
         /new-home React form (src/components/NShero.tsx). The Vue app mounts async,
         so we wait for .hero-content-inner and append the form after the heading
         copy. On a valid submit we postMessage the parent Next.js page, which does
         a client-side router.push('/demo') (see Home2Hero.jsx). -->
    <style>
      /* Injected phone CTA + trust row. Shown on ALL widths; layout differs by
         breakpoint. Base = mobile (centered, full-width block button, stacked
         trust); the min-width:1024px block below restyles to the desktop layout. */
      #ss-phone-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-self: center;
        width: min(22rem, 84vw);
        font-family: Urbanist, sans-serif;
      }
      #ss-phone-form .ss-pill {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 4px 4px 0;
        border: 2px solid #03215F;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        overflow: hidden;
      }
      #ss-phone-form .ss-dial {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        width: 48px;
        flex-shrink: 0;
        border-right: 1px solid #e5e7eb;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
      }
      #ss-phone-form .ss-input {
        height: 36px;
        min-width: 0;
        flex: 1;
        padding: 0 8px;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 13px;
        color: #111827;
      }
      #ss-phone-form .ss-input::placeholder { color: #9ca3af; }
      #ss-phone-form .ss-submit {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 0;
        border-radius: 9999px;
        background: #FFCC00;
        color: #111827;
        font-weight: 700;
        font-family: inherit;
        box-shadow: 0 4px 6px -1px rgba(255, 204, 0, 0.3);
        cursor: pointer;
        transition: filter 0.2s ease;
      }
      #ss-phone-form .ss-submit:hover { filter: brightness(1.05); }
      #ss-phone-form .ss-submit svg { width: 14px; height: 14px; }
      /* Mobile: in-pill button hidden, standalone full-width button shown. */
      #ss-phone-form .ss-submit-inline { display: none; }
      #ss-phone-form .ss-submit-block {
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
      }
      #ss-phone-form .ss-error {
        font-size: 13px;
        font-weight: 500;
        color: #ef4444;
        text-align: center;
      }
      #ss-phone-form .ss-error:empty { display: none; }

      /* Trust row is desktop-only; hidden on mobile (re-enabled at min-width:1024px). */
      #ss-trust {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        align-self: center;
        text-align: center;
        width: min(22rem, 84vw);
        font-family: Urbanist, sans-serif;
      }
      #ss-trust .ss-trust-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #ss-trust .ss-trust-label {

        text-transform: uppercase;
        color: #5f5646;
      }

        width: auto;
        object-fit: contain;
      }

      }

        font-weight: 600;
        line-height: 1.3;

      }

      /* Desktop: form left-aligned, button back inside the pill, trust as a
         horizontal row with dividers. */
      @media (min-width: 1024px) {
        #ss-phone-form {
          align-self: flex-start;
          width: 32rem;
          max-width: 90vw;
        }
        #ss-phone-form .ss-submit-inline {
          display: flex;
          height: 32px;
          flex-shrink: 0;
          padding: 0 16px;
          font-size: 12px;
        }
        #ss-phone-form .ss-submit-block { display: none; }

        #ss-trust {
          display: flex;
          flex-direction: row;
          align-items: center;
          gap: 28px;
          align-self: flex-start;
          text-align: left;
          width: auto;
        }
        #ss-trust .ss-trust-col { align-items: flex-start; }

          padding-left: 28px;
          border-left: 1px solid rgba(45, 42, 36, 0.15);
        }
      }
    </style>
    <script>
      (function () {
        var FORM_ID = "ss-phone-form";
        var TRUST_ID = "ss-trust";

        function buildForm() {
          var form = document.createElement("form");
          form.id = FORM_ID;
          form.setAttribute("novalidate", "");
          form.innerHTML =
            '<div class="ss-pill">' +
            '<span class="ss-dial">+61</span>' +
            '<input class="ss-input" type="tel" inputmode="numeric" ' +
            'placeholder="Phone number" aria-label="Phone number" />' +
            '<button class="ss-submit ss-submit-inline" type="submit">Try a Free Class' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
            'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ' +
            'aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>' +
            "</svg></button>" +
            "</div>" +
            '<button class="ss-submit ss-submit-block" type="submit">Try a Free Class</button>' +
            '<p class="ss-error" role="alert"></p>';

          var input = form.querySelector(".ss-input");
          var error = form.querySelector(".ss-error");

          form.addEventListener("submit", function (e) {
            e.preventDefault();
            var value = (input.value || "").trim();
            if (/^\d{6,15}$/.test(value)) {
              error.textContent = "";
              try {
                window.parent.postMessage(
                  { type: "ss-open-demo" },
                  window.location.origin
                );
              } catch (err) {
                window.top.location.href = "/demo";
              }
            } else {
              error.textContent = "Please enter a valid phone number";
            }
          });

          return form;
        }

        function buildTrust() {
          var trust = document.createElement("div");
          trust.id = TRUST_ID;
          trust.innerHTML =
            '<div class="ss-trust-col">' +
            '<p class="ss-trust-label">Trusted Feedback</p>' +
            '<img class="ss-trust-logo" src="/googlev2.png" alt="Google Reviews" />' +
            '<p class="ss-trust-sub">30 reviews</p>' +
            "</div>" +
            '<div class="ss-trust-col">' +
            '<p class="ss-trust-label">Accredited by</p>' +
            '<img class="ss-trust-logo" src="/Stem.png" alt="STEM Accredited" />' +
            "</div>" +
            '<div class="ss-trust-col">' +
            '<p class="ss-trust-stat">80% learners show increased confidence in 2 weeks</p>' +
            "</div>";
          return trust;
        }

        function inject() {
          var container = document.querySelector(".hero-content-inner");
          if (!container) return;
          var copys = container.querySelector(".hero-content-copys");
          var anchor = copys || null;

          if (!container.querySelector("#" + FORM_ID)) {
            var form = buildForm();
            if (anchor && anchor.nextSibling) {
              container.insertBefore(form, anchor.nextSibling);
            } else {
              container.appendChild(form);
            }
            anchor = form;
          } else {
            anchor = container.querySelector("#" + FORM_ID);
          }

          if (!container.querySelector("#" + TRUST_ID)) {
            var trust = buildTrust();
            if (anchor && anchor.nextSibling) {
              container.insertBefore(trust, anchor.nextSibling);
            } else {
              container.appendChild(trust);
            }
          }
        }

        function start() {
          inject();
          var observer = new MutationObserver(function () {
            inject();
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>

    <!-- SuperSheldon "Features" redesign. The bundle's BoxServices.vue renders a
         hologram card with a bulleted list (.box-services) once the scan
         completes. We hide that card and, inside the same .about-services
         wrapper, mount five icon callouts arranged around the avatar with
         dotted leader lines pointing at the body (top: Live Interactive
         Classes; head level: Personalized Learning Paths / Expert Teachers;
         hand level: AI-Powered Practice / Progress Tracking).
         Why inside .about-services: GSAP scrubs that wrapper's opacity with
         scroll (animations/transitions/about.ts → setupSectionsAnimation), so
         the new layout inherits the exact fade-in/out timing of the card it
         replaces. A MutationObserver on the wrapper's inline style toggles
         .ss-in, which staggers the callouts + lines in.
         Positions are viewport percentages tuned against the camera's
         portrait "about-2" waypoint, whose focus.y was raised 0.8 → 2 in
         chunks/index-eeBi9twy.js (search `focus:{x:0,y:2,z:6}`) so the avatar
         sits lower on phones and leaves room for the top callout. "about-1"
         keeps the original 0.8 so the scan caption at the bottom does not
         cover the platform; the same chunk's scenes timeline was retimed to
         glide about-1 → about-2 over 40–65% of the scan (was the whole scan),
         and the portrait sections timeline shows the callouts from 0.7 (was
         0.6) so they appear only once the camera has settled. Landscape
         keeps the SuperSheldon/description cards on the left, so the five
         callouts fan down the avatar's right side instead of surrounding it;
         short landscape viewports (phones held sideways, < 480px tall) get a
         compact icon-beside-label column on the right instead (.ss-row).

        #ss-features { --ss-icon: 66px; --ss-label: 15px; --ss-label-w: 140px; }
      }

      .ss-callout {
        --ss-tx: -50%;
        position: absolute;
        transform: translate(var(--ss-tx), 10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;

      @media (orientation: landscape) and (max-height: 479px) {
        #ss-features { --ss-icon: 38px; --ss-label: 11.5px; --ss-label-w: 150px; }
        .ss-callout { --ss-tx: 0; flex-direction: row; gap: 10px; width: auto; max-width: var(--ss-label-w); }
        .ss-callout .ss-icon { flex-shrink: 0; }
        .ss-callout .ss-label { text-align: left; }
        .ss-icon::before { inset: -5px; }
      }

      .ss-icon {
        position: relative;
        width: var(--ss-icon);
        height: var(--ss-icon);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eaf7ff;
        background:
          radial-gradient(circle at 50% 40%, rgba(52, 191, 255, 0.28) 0%, rgba(0, 53, 133, 0.55) 70%, rgba(0, 53, 133, 0.65) 100%);
        border: 1.5px solid rgba(120, 214, 255, 0.85);
        box-shadow:
          0 0 0 4px rgba(52, 191, 255, 0.12),
          0 0 18px var(--ss-glow),
          inset 0 0 12px rgba(52, 191, 255, 0.35);
      }
      /* outer thin ring with a gap, like a HUD reticle */
      .ss-icon::before {
        content: "";
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 1px solid rgba(120, 214, 255, 0.55);
        border-top-color: transparent;
        border-bottom-color: transparent;
      }
      .ss-icon svg {
        width: 52%;
        height: 52%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px rgba(120, 214, 255, 0.9));
      }
      .ss-label {
        margin: 0;
        font-size: var(--ss-label);
        font-weight: 600;
        line-height: 1.25;

        text-align: center;
        color: #f2faff;
        text-shadow: 0 0 10px rgba(52, 191, 255, 0.55), 0 1px 2px rgba(0, 20, 60, 0.6);
      }

      /* dotted leader: a 4px strip of round dots, rotated from its left end */
      .ss-line {
        position: absolute;
        height: 4px;
        transform-origin: 0 50%;
        background-image: radial-gradient(circle, rgba(150, 226, 255, 0.95) 1.35px, transparent 1.9px);
        background-size: 7px 4px;
        background-repeat: repeat-x;
        opacity: 0;
        transition: opacity 0.3s ease;

        opacity: 0;
        transition: opacity 0.3s ease;
        transition-delay: calc(var(--i) * 90ms + 180ms);
      }
      .ss-in .ss-dot { opacity: 1; }

              '<path d="M11.5 8.5h3.5l1.5-1.5M11.5 12h6M11.5 15.5h3.5l1.5 1.5"/>' +
              '<circle cx="18" cy="6.5" r="1.1"/><circle cx="19" cy="12" r="1.1"/><circle cx="18" cy="17.5" r="1.1"/>',
          },
          {
            label: "Progress Tracking",
            p: { x: 83, y: 58, tx: 62.5, ty: 54 },
            l: { x: 69, y: 84, tx: 55, ty: 77 },
            s: { x: 72, y: 88, tx: 54, ty: 78 },
            icon:
              '<path d="M5 19v-4M9.5 19v-8M14 19V7M18.5 19V4" style="stroke-width:2.6"/>',
          },
        ];

        var root = null;
        var lines = [];

        function build() {
          root = document.createElement("div");
          root.id = ID;
          root.setAttribute("aria-hidden", "true");
          ITEMS.forEach(function (item, i) {
            var c = document.createElement("div");
            c.className = "ss-callout";
            c.style.setProperty("--i", i);
            c.innerHTML =
              '<div class="ss-icon"><svg viewBox="0 0 24 24" aria-hidden="true">' +
              item.icon +
              '</svg></div><p class="ss-label">' +
              item.label +
              "</p>";
            var line = document.createElement("div");
            line.className = "ss-line";
            line.style.setProperty("--i", i);
            var dotA = document.createElement("div");
            dotA.className = "ss-dot";
            dotA.style.setProperty("--i", i);
            var dotB = dotA.cloneNode();
            root.appendChild(line);
            root.appendChild(dotA);
            root.appendChild(dotB);
            root.appendChild(c);
            lines.push({ item: item, el: c, line: line, dotA: dotA, dotB: dotB });
          });
          return root;
        }

        function mode() {
          if (!window.matchMedia("(orientation: landscape)").matches) return "p";
          return window.matchMedia("(max-height: 479px)").matches ? "s" : "l";
        }

        // Point where a ray from the box centre toward (tx,ty) leaves the box.
        function edgePoint(rect, tx, ty) {
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var dx = tx - cx;
          var dy = ty - cy;
          if (!dx && !dy) return { x: cx, y: cy };
          var sx = dx ? rect.width / 2 / Math.abs(dx) : Infinity;
          var sy = dy ? rect.height / 2 / Math.abs(dy) : Infinity;
          var s = Math.min(sx, sy);
          return { x: cx + dx * s, y: cy + dy * s };
        }

        function layout() {
          if (!root || !root.isConnected) return;
          var W = root.clientWidth;
          var H = root.clientHeight;
          if (!W || !H) return;
          var rootRect = root.getBoundingClientRect();
          var m = mode();
          root.classList.toggle("ss-row", m === "s");
          lines.forEach(function (o) {
            var p = o.item[m];
            var x = (p.x / 100) * W;
            var y = (p.y / 100) * H;
            var tx = (p.tx / 100) * W;
            var ty = (p.ty / 100) * H;
            // Place the callout so its icon centre sits at (x,y). In row mode
            // the callout is not centred by transform, so offset by the icon.
            var icon = o.el.firstElementChild;
            var iconH = icon.offsetHeight || 0;
            var iconW = icon.offsetWidth || 0;
            o.el.style.left = (m === "s" ? x - iconW / 2 : x) + "px";
            o.el.style.top = y - iconH / 2 + "px";
            // Leader from the icon circle's edge (or the whole callout box for
            // a = "box"), plus a small gap, to the target.
            var start;
            if (o.item.a === "box") {
              var r = o.el.getBoundingClientRect();
              start = edgePoint(
                { left: r.left - rootRect.left, top: r.top - rootRect.top, width: r.width, height: r.height },
                tx,
                ty
              );
            } else {
              var ddx = tx - x;
              var ddy = ty - y;
              var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
              // +7 clears the outer reticle ring drawn by .ss-icon::before
              var rad = iconW / 2 + 7;
              start = { x: x + (ddx / dd) * rad, y: y + (ddy / dd) * rad };
            }
            var dx = tx - start.x;
            var dy = ty - start.y;
            var len = Math.sqrt(dx * dx + dy * dy) || 1;
            var gap = 6;
            var ux = dx / len;
            var uy = dy / len;
            var sx = start.x + ux * gap;
            var sy = start.y + uy * gap;
            var l = Math.max(0, len - gap - 5);
            o.line.style.left = sx + "px";
            o.line.style.top = sy - 2 + "px";
            o.line.style.width = l + "px";
            o.line.style.transform = "rotate(" + (Math.atan2(dy, dx) * 180) / Math.PI + "deg)";
            o.dotA.style.left = sx + "px";
            o.dotA.style.top = sy + "px";
            o.dotB.style.left = tx + "px";
            o.dotB.style.top = ty + "px";
          });
        }

        function watchOpacity(wrapper) {
          var apply = function () {
            var o = parseFloat(wrapper.style.opacity);
            if (isNaN(o)) o = 1;
            root.classList.toggle("ss-in", o > 0.02);
          };
          apply();
          new MutationObserver(apply).observe(wrapper, { attributes: true, attributeFilter: ["style"] });
        }

        function mount() {
          if (root && root.isConnected) return true;
          var wrapper = document.querySelector(".about-services");
          if (!wrapper) return false;
          wrapper.appendChild(root || build());
          watchOpacity(wrapper);
          layout();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
          return true;
        }

        function start() {
          if (!mount()) {
            var mo = new MutationObserver(function () {
              if (mount()) mo.disconnect();
            });
            mo.observe(document.body, { childList: true, subtree: true });
          }
          var raf = 0;
          var onResize = function () {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(layout);
          };
          window.addEventListener("resize", onResize);
          window.addEventListener("orientationchange", onResize);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>

    <div class="preloader">
      <svg class="preloader-svg" viewBox="0 0 56 61" xmlns="http://www.w3.org/2000/svg">
        <mask id="preloader-mask">
          <rect fill="black" height="61" width="61"></rect>
          <rect fill="white" height="61" width="61" class="preloader-rect" style="transform: scaleY(0)"></rect>
        </mask>

        <use href="#logo-path" class="preloader-path" opacity="0.3"></use>
        <use href="#logo-path" class="preloader-path" mask="url(#preloader-mask)"></use>
      </svg>
    </div>
  </body>
